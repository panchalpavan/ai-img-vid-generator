[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for img-vid-generation"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "celery>=5.6.3",
    "fastapi>=0.136.1",
    "google-generativeai>=0.8.6",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.12.1",
    "redis>=7.4.0",
    "sqlmodel>=0.0.38",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

# ---------------------------------------------------------------------------
# Ruff: linter + formatter (replaces black, flake8, isort)
# Docs: https://docs.astral.sh/ruff/
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
# Migration files are generated by Alembic from a Mako template we don't own.
# Linting them creates noise on every new migration; excluding them is standard.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Enabled rule sets:
#   E, W  -> pycodestyle (style)
#   F     -> pyflakes (unused imports, undefined names)
#   I     -> isort (import ordering)
#   B     -> flake8-bugbear (common bugs)
#   UP    -> pyupgrade (modern Python idioms)
#   N     -> pep8-naming (function/class naming)
#   SIM   -> flake8-simplify (simpler expressions)
#   TID   -> flake8-tidy-imports (no relative imports)
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "TID"]
ignore = [
    "E501",  # line-too-long — formatter handles it; ignore the lint check
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]  # allow test function names like test_GET_returns_200

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy: static type checker
# Docs: https://mypy.readthedocs.io/
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Common pattern: tests can be looser
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# Celery's @task decorator has no type stubs; under strict mode that flags
# every task as "untyped." This override scopes the leniency to task files.
module = "app.tasks.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Celery as a whole ships no inline types (no py.typed marker, no stubs
# package). Telling mypy to skip its imports is the documented workaround.
module = "celery.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# google-generativeai (Gemini SDK) ships a partial py.typed marker but
# its types are inconsistent (top-level symbols not re-exported, generation
# config accepts plain dict but typed as a specific class). Scope the
# leniency to our adapter file.
module = "app.providers.google_ai_studio"
disable_error_code = ["attr-defined", "arg-type"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"
